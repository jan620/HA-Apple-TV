# Konfiguration der Wegwerf-Instanz für die App-Prüfung.
#
# Diese Datei wird beim ersten Start von Home Assistant um eigene Einträge
# ergänzt; die hier stehenden bleiben erhalten.

default_config:

# Liefert Lichter, Klima, Abdeckungen, Sensoren, einen Media Player und eine
# Wetter-Entität — genug, damit jeder Kartentyp der App etwas anzuzeigen hat.
demo:

# Deutsche Oberfläche, damit die Prüfung dasselbe sieht wie in den Screenshots.
homeassistant:
  name: Roomglance Demo
  language: de
  time_zone: Europe/Berlin
  country: DE

# Caddy läuft im selben Compose-Netz und reicht die Anfragen weiter. Ohne
# diese Angaben lehnt Home Assistant alles ab, was nicht direkt vom Client
# kommt — mit „400: Bad Request" und einem Eintrag im Log. Der Bereich deckt
# die Adressen ab, die Docker seinen Compose-Netzen gibt.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12

# Die Demo-Sensoren liefern Verbrauchswerte; damit lässt sich das
# Energie-Dashboard in der Oberfläche einrichten und die App hat dort etwas
# zu zeigen. Ohne Recorder bleiben die Statistiken leer.
recorder:
  purge_keep_days: 3

logger:
  default: warning
