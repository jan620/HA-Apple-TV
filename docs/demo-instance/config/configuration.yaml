# Konfiguration der Wegwerf-Instanz für die App-Prüfung.
#
# Diese Datei wird beim ersten Start von Home Assistant um eigene Einträge
# ergänzt; die hier stehenden bleiben erhalten.

default_config:

# Liefert Lichter, Klima, Abdeckungen, Sensoren, einen Media Player und eine
# Wetter-Entität — genug, damit jeder Kartentyp der App etwas anzuzeigen hat.
demo:

# Deutsche Oberfläche, damit die Prüfung dasselbe sieht wie in den Screenshots.
homeassistant:
  name: Roomglance Demo
  language: de
  time_zone: Europe/Berlin
  country: DE

# Kein `http:`-Block, und das ist Absicht. Caddy entfernt die
# Weiterleitungs-Kopfzeilen, bevor die Anfrage hier ankommt (siehe Caddyfile),
# also gibt es nichts, worüber Home Assistant stolpern könnte. Der Versuch,
# es andersherum zu lösen — `use_x_forwarded_for: true` mit passenden
# `trusted_proxies` — schlug auf zwei unabhängigen Aufbauten fehl, obwohl
# `check_config` die Werte bestätigte.

# Die Demo-Sensoren liefern Verbrauchswerte; damit lässt sich das
# Energie-Dashboard in der Oberfläche einrichten und die App hat dort etwas
# zu zeigen. Ohne Recorder bleiben die Statistiken leer.
recorder:
  purge_keep_days: 3

# Kein `logger:`-Block mit `default: warning`: das unterdrückt die
# Startmeldungen und macht jede Fehlersuche blind. Die Standardstufe ist
# gesprächiger, aber bei einer Instanz, die nur ein paar Tage läuft, ist das
# kein Nachteil.
