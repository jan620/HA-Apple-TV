# Wegwerf-Instanz für die App-Prüfung im App Store.
#
# Home Assistant ist bewusst **nicht** nach außen veröffentlicht — nur Caddy
# hört auf 80 und 443. Der Weg von außen führt ausschließlich über den
# Reverse Proxy, und Caddy besorgt das Zertifikat selbst.
#
#   cp .env.example .env   # DEMO_DOMAIN eintragen
#   docker compose up -d

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-demo
    restart: unless-stopped
    # Kein `ports:` — erreichbar ist die Instanz nur über das Compose-Netz.
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Berlin

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Aus der .env-Datei; Caddy setzt den Wert im Caddyfile ein.
      - DEMO_DOMAIN=${DEMO_DOMAIN:?DEMO_DOMAIN fehlt — .env.example nach .env kopieren}
    depends_on:
      - homeassistant

# Hier liegen die ausgestellten Zertifikate. Bleiben die Bände erhalten,
# stellt Let's Encrypt nach einem Neustart kein neues Zertifikat aus — das
# schont das Ausstellungslimit von fünf Zertifikaten je Woche und Domain.
volumes:
  caddy-data:
  caddy-config:
