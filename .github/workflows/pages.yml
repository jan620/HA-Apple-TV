name: Datenschutzerklärung veröffentlichen

# Veröffentlicht PRIVACY.md als HTML-Seite auf GitHub Pages. App Store Connect
# verlangt für die Datenschutzerklärung eine öffentlich erreichbare URL.
on:
  push:
    branches: [main]
    paths:
      - PRIVACY.md
      - Tools/build_privacy_page.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deploy bereits, wird es zu Ende gebracht statt abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Markdown-Renderer installieren
        run: pip install --quiet 'markdown==3.*'

      - name: Seite bauen
        run: python3 Tools/build_privacy_page.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
